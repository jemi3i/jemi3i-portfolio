
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JEMI3I | Marwen Jemai — Software Engineering & Community</title>
    <meta name="description" content="Personal portfolio of Marwen Jemai (JEMI3I) — Fifth-year Software Engineering student at ESPRIT specialized in Web and Internet Technologies (TWIN). Open for final-year PFE internship and European Solidarity Corps (ESC) volunteering." />
    <meta property="og:title" content="JEMI3I | Marwen Jemai — Software Engineering & Community" />
    <meta property="og:description" content="Software Engineering, Creative Technology & Community Engagement by Marwen Jemai (ESPRIT TWIN)." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Space+Grotesk:wght@300;700&family=JetBrains+Mono:wght@300;500&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                black: '#020202',
                white: '#F5F5F5',
                red: '#FF0000',
                gray: '#111111'
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            letterSpacing: {
              'brutal': '-0.08em',
              'technical': '0.5em',
            },
            animation: {
              'glitch': 'glitch 0.3s cubic-bezier(.25,.46,.45,.94) both infinite',
              'glitch-subtle': 'glitch-subtle 4.5s ease-in-out infinite',
              'glitch-burst': 'glitch-burst 0.35s ease-out forwards',
              'ticker': 'ticker 30s linear infinite',
            }
          }
        }
      }
    </script>
    <style>
      body {
        cursor: crosshair;
        background-color: #020202;
        color: #F5F5F5;
        overflow-x: hidden;
      }
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: #000; }
      ::-webkit-scrollbar-thumb { background: #FF0000; }
      
      @keyframes noise {
        0% { transform: translate(0,0) }
        10% { transform: translate(-5%,-5%) }
        100% { transform: translate(5%,5%) }
      }

      @keyframes scroll {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
      }

      @keyframes ticker {
        0% { transform: translateX(0); }
        100% { transform: translateX(-100%); }
      }

      @keyframes glitch {
        0% { transform: translate(0); opacity: 1; }
        25% { transform: translate(-1.5px, 1.5px); opacity: 0.8; }
        50% { transform: translate(1.5px, -1.5px); opacity: 0.9; }
        75% { transform: translate(-1px, -1px); opacity: 0.8; }
        100% { transform: translate(0); opacity: 1; }
      }

      @keyframes glitch-subtle {
        0%, 93%, 100% {
          transform: translate(0, 0);
          opacity: 0;
        }
        94% {
          transform: translate(-1px, 0.5px);
          opacity: 0.55;
        }
        96% {
          transform: translate(1px, -0.5px);
          opacity: 0.6;
        }
        98% {
          transform: translate(-0.5px, -0.5px);
          opacity: 0.45;
        }
      }

      @keyframes glitch-burst {
        0% { transform: translate(0, 0); opacity: 0; }
        20% { transform: translate(-1.5px, 0.5px); opacity: 0.7; }
        40% { transform: translate(1.5px, -0.5px); opacity: 0.75; }
        60% { transform: translate(-1px, 0.5px); opacity: 0.6; }
        80% { transform: translate(0.5px, -0.5px); opacity: 0.5; }
        100% { transform: translate(0, 0); opacity: 0; }
      }

      .vertical-rl {
        writing-mode: vertical-rl;
      }

      @media (prefers-reduced-motion: reduce) {
        *, ::before, ::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body class="antialiased selection:bg-brand-red selection:text-white">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
